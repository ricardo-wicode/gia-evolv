# Entornos del CLI de Shopify.
#
# Uso:  shopify theme dev -e gia
#       shopify theme push -e gia --unpublished --theme "Gia Evolv"
#
# Fija la tienda para que el CLI no tome la última usada, que es lo que
# pasa al alternar entre proyectos de clientes.
#
# El token NO va aquí: este repo es público. Va en el entorno, como
# SHOPIFY_CLI_THEME_TOKEN, o se pasa con --password.

[environments.gia]
# El dominio permanente de la tienda, no el principal. Shopify sirve la
# tienda en gia-evolv-2.myshopify.com, pero el CLI y la Admin API sólo
# reconocen éste; con el otro devuelve 401 o "no tienes acceso".
store = "bz98pj-fk.myshopify.com"
